# 비유비교 사전 — 기사 빈출 비유 기준물의 언론 관행값
#
# 용도: claim_type=METAPHORIC("여의도 면적의 3배") 표현을 실수치로 환산.
# 값 선정 원칙: 언론 보도 관행값 우선(공식값과 다르면 note 에 병기).
# source/note 는 프로그램이 쓰지 않는 사람용 기록 — 값의 출처·정의 논쟁 방지용.
#
# 필드:
#   id        영문 식별자 (유일)
#   name      표준 명칭
#   aliases   기사에서 쓰이는 표기들 (전 엔트리 통틀어 유일해야 함)
#   category  area | height | length | volume | weight
#   value     기준값 (반드시 양수)
#   unit      km2 | m2 | m | km | m3 | 톤  (ASCII 표기, 무게만 KOSIS 단위 '톤')
#   counters  수량사 — "축구장 70개", "지구 두 바퀴" 식 매칭에 사용 (기본 [개])
#   source    값의 출처/기준
#   note      주의사항 (다른 정의·값이 통용되는 경우 등)

version: 1

entries:
  # ── 면적 (area) ──────────────────────────────────────────────
  - id: yeouido_area
    name: 여의도 면적
    aliases: [여의도 면적, 여의도]
    category: area
    value: 2.9
    unit: km2
    source: "언론 관행값 — 제방 안쪽(윤중로 둑 내부) 기준"
    note: "정의에 따라 4.5㎢(행정구역 여의도동)·8.4㎢(한강 둔치 포함)도 쓰임. 기사가 다른 정의를 쓰면 최대 3배 오차 가능"

  - id: soccer_field_area
    name: 축구장 면적
    aliases: [축구장, 축구 경기장]
    category: area
    value: 7140
    unit: m2
    counters: [개]
    source: "FIFA 국제규격 105m × 68m = 7,140㎡"
    note: "기사에 따라 7,500㎡로 어림하기도 함"

  - id: seoul_area
    name: 서울시 면적
    aliases: [서울시 면적, 서울 면적]
    category: area
    value: 605.2
    unit: km2
    source: "서울특별시 공식 행정구역 면적 605.2㎢"
    note: "'서울' 단독 표기는 인구·예산 등 다른 비교와 혼동되어 별칭에서 제외"

  - id: south_korea_area
    name: 대한민국 면적
    aliases: [대한민국 면적, 남한 면적, 국토 면적]
    category: area
    value: 100449
    unit: km2
    source: "국토교통부 지적통계(2023) 100,449㎢"
    note: "언론에서 '약 10만㎢'로 어림하는 값"

  - id: jeju_area
    name: 제주도 면적
    aliases: [제주도 면적, 제주 면적]
    category: area
    value: 1850
    unit: km2
    source: "제주특별자치도 1,850.3㎢"

