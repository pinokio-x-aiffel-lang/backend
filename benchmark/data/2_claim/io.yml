module: extract_statistical_claims
step: 2
folder: "2_claim"
title: "클레임 추출"
description: "기사 본문을 원자 문장으로 쪼개 수치 기반 Claim 을 추출한다(claim_type=NONE 포함)."
# reads = 모듈이 입력으로 읽는 MasterSchema 필드
reads:
  - field: "article"
    type: "Article"
    desc: "[1]에서 적재된 기사"
# writes = 모듈이 출력으로 쓰는 MasterSchema 필드
writes:
  - field: "sentences"
    type: "list[str]"
    desc: "필터·원자화된 검증 단위 문장"
  - field: "claims"
    type: "list[Claim]"
    desc: "추출된 수치 주장 (value.llm_value 는 아직 빈값)"

schema_source: "src/schemas/runtime.py (MasterSchema)"
# record_fields = 테스트셋 파일(*_source_1.jsonl) 한 줄(=한 샘플)이 실제로 갖는 최상위 키 목록
record_fields:
  [
    "provenance",
    "src_id",
    "label",
    "claim_type_gold",
    "src_text",
    "gold_n_claims",
    "gold_claims",
  ]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["provenance", "src_id"]
  "② 입력": ["src_text"]
  "③ 정답(gold)": ["label", "claim_type_gold", "gold_n_claims", "gold_claims"]
