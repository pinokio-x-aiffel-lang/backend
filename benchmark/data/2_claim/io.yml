module: extract_statistical_claims
step: 2
folder: "2_claim"
title: "클레임 추출"
description: "기사 본문을 원자 문장으로 쪼개 수치 기반 Claim 을 추출한다(claim_type=NONE 포함)."
reads:
  - field: "article"
    type: "Article"
    desc: "[1]에서 적재된 기사"
writes:
  - field: "sentences"
    type: "list[str]"
    desc: "필터·원자화된 검증 단위 문장"
  - field: "claims"
    type: "list[Claim]"
    desc: "추출된 수치 주장 (value.llm_value 는 아직 빈값)"

# reads/writes 타입(Claim·Article·ClaimAnalysis 등)은 모두 src/schemas/runtime.py 의 MasterSchema 정의
schema_source: "src/schemas/runtime.py (MasterSchema)"
# 테스트셋 레코드(이 단계 *_source_1.jsonl) 의 실제 최상위 필드 (구조 상세는 io.jsonl 예시)
record_fields: ["provenance", "src_id", "label", "claim_type_gold", "src_text", "gold_n_claims", "gold_claims"]
