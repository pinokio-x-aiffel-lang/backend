module: fetch_kosis_data
step: 5
folder: "5_fetch"
title: "KOSIS 셀 값 조회"
description: "후보 표별로 항목/분류축을 매칭해 셀 값을 조회하고 매칭된 셀을 evidences 로 적재한다."
# reads = 모듈이 입력으로 읽는 MasterSchema 필드
reads:
  - field: "claims"
    type: "list[Claim]"
    desc: "subject/population/period 매칭 기준"
  - field: "analysis[*].candidates"
    type: "list[KosisCandidate]"
    desc: "[4] 후보 표 풀"
# writes = 모듈이 출력으로 쓰는 MasterSchema 필드
writes:
  - field: "analysis[*].kosis_query"
    type: "KosisQuery"
    desc: "statisticsData 호출 로그"
  - field: "analysis[*].cell_attempts"
    type: "list[CellAttempt]"
    desc: "후보 표별 매칭 시도(디버깅)"
  - field: "analysis[*].evidences"
    type: "list[Evidence]"
    desc: "매칭된 셀(RANK 순)"

schema_source: "src/schemas/runtime.py (MasterSchema)"
# record_fields = 테스트셋 파일(*_source_1.jsonl) 한 줄(=한 샘플)이 실제로 갖는 최상위 키 목록
record_fields:
  [
    "row_id",
    "label",
    "claim_id",
    "claim",
    "candidates",
    "gold",
    "scorable",
    "scorable_reason",
  ]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["row_id", "claim_id"]
  "② 입력": ["claim", "candidates"]
  "③ 정답(gold)": ["label", "gold"]
  "④ 채점 가능 메타": ["scorable", "scorable_reason"]
