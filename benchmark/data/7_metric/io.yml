module: calculate_metric
step: 7
folder: "7_metric"
title: "통계 수치 비교 판단"
description: "정규화된 주장 수치와 KOSIS 공식 수치(evidences[0])를 비교해 MetricResult 를 만든다(verdict T/F/NEI 초기)."
reads:
  - field: "claims[*].value.llm_value"
    type: "str"
    desc: "정규화된 주장 수치"
  - field: "analysis[*].evidences"
    type: "list[Evidence]"
    desc: "KOSIS 공식 수치(선정 셀)"
writes:
  - field: "verifications"
    type: "Verifications"
    desc: "생성 — claim_results 스켈레톤 + summary"
  - field: "verifications.claim_results[*].metric"
    type: "MetricResult"
    desc: "비교 결과(verdict 초기값)"

# reads/writes 타입(Claim·Article·ClaimAnalysis 등)은 모두 src/schemas/runtime.py 의 MasterSchema 정의
schema_source: "src/schemas/runtime.py (MasterSchema)"
# 테스트셋 레코드(이 단계 *_source_1.jsonl) 의 실제 최상위 필드 (구조 상세는 io.jsonl 예시)
record_fields: ["row_id", "label", "claim_id", "gold_verdict_stage7", "has_evidence", "claim", "scorable", "scorable_reason"]
