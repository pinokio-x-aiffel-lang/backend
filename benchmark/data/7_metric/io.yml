module: calculate_metric
step: 7
folder: "7_metric"
title: "통계 수치 비교 판단"
description: "정규화된 주장 수치와 KOSIS 공식 수치(evidences[0])를 비교해 MetricResult 를 만든다(verdict T/F/NEI 초기)."

# reads = 모듈이 입력으로 읽는 MasterSchema 필드
reads:
  - field: "claims[*].value.llm_value"
    type: "str"
    desc: "정규화된 주장 수치"
  - field: "analysis[*].evidences"
    type: "list[Evidence]"
    desc: "KOSIS 공식 수치(선정 셀)"

# writes = 모듈이 출력으로 쓰는 MasterSchema 필드
writes:
  - field: "verifications"
    type: "Verifications"
    desc: "생성 — claim_results 스켈레톤 + summary"
  - field: "verifications.claim_results[*].metric"
    type: "MetricResult"
    desc: "비교 결과(verdict 초기값)"

schema_source: "src/schemas/runtime.py (MasterSchema)"
# record_fields = 테스트셋 파일(*_source_1.jsonl) 한 줄(=한 샘플)이 실제로 갖는 최상위 키 목록
record_fields:
  [
    "row_id",
    "label",
    "claim_id",
    "gold_verdict_stage7",
    "has_evidence",
    "claim",
    "scorable",
    "scorable_reason",
  ]
# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["row_id", "claim_id"]
  "② 입력": ["claim"]
  "③ 정답(gold)": ["label", "gold_verdict_stage7"]
  "④ 채점 가능 메타": ["has_evidence", "scorable", "scorable_reason"]
