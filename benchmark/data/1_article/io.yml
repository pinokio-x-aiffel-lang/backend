module: load_article
step: 1
folder: "1_article"
title: "기사 내용 확인"
description: "content(URL 또는 본문 텍스트)를 Article 로 변환한다."
# reads = 모듈이 입력으로 읽는 MasterSchema 필드
reads:
  - field: "content"
    type: "str | None"
    desc: "기사 URL 또는 본문 텍스트 (원본 입력)"
# writes = 모듈이 출력으로 쓰는 MasterSchema 필드
writes:
  - field: "article"
    type: "Article"
    desc: "원문 기사 메타데이터(article_id/title/content/published_at/source/url)"

# record_fields = 테스트셋 파일(*_source_1.jsonl) 한 줄(=한 샘플)이 실제로 갖는 최상위 키 목록
schema_source: "src/schemas/runtime.py (MasterSchema)"
record_fields:
  [
    "source_id",
    "source_sentence",
    "claim_id",
    "article_id",
    "sentence",
    "claim_type",
    "subject",
    "value",
    "unit",
    "aggregation",
    "period_type",
    "period_value",
    "compare_period_value",
    "compare_conquer",
    "population",
    "cited_source",
  ]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["source_id", "claim_id"]
  "② 입력": ["source_sentence", "article_id", "sentence", "claim_type", "subject", "value", "unit", "aggregation", "period_type", "period_value", "compare_period_value", "compare_conquer", "population", "cited_source"]
