module: generate_explanation
step: 10
folder: "10_explanation"
title: "설명 생성"
description: "claim별 설명과 기사 단위 종합 의견(overall_opinion)을 생성한다(LLM 실패 시 템플릿 폴백)."
reads:
  - field: "verifications"
    type: "Verifications"
    desc: "[9] 확정 판정 결과"
  - field: "claims"
    type: "list[Claim]"
    desc: "subject/unit/period 참조"
writes:
  - field: "verifications.claim_results[*].explanation"
    type: "str"
    desc: "claim별 설명"
  - field: "verifications.summary.overall_opinion"
    type: "str"
    desc: "기사 단위 LLM 종합 의견"

# reads/writes 타입(Claim·Article·ClaimAnalysis 등)은 모두 src/schemas/runtime.py 의 MasterSchema 정의
schema_source: "src/schemas/runtime.py (MasterSchema)"
# 테스트셋 레코드(이 단계 *_source_1.jsonl) 의 실제 최상위 필드 (구조 상세는 io.jsonl 예시)
record_fields: ["row_id", "label", "claim_id", "claim", "claim_result", "gold_template", "opinion_rubric", "scorable", "scorable_reason"]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["row_id", "claim_id"]
  "② 입력": ["claim", "claim_result"]
  "③ 정답(gold)": ["label", "gold_template", "opinion_rubric"]
  "④ 채점 가능 메타": ["scorable", "scorable_reason"]
