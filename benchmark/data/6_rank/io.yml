module: rank_evidence
step: 6
folder: "6_rank"
title: "증거 랭킹"
description: "claim 적합도로 evidences 를 재정렬해 1위 적합 표를 evidences[0] 으로 둔다."
reads:
  - field: "analysis[*].evidences"
    type: "list[Evidence]"
    desc: "[5]가 내보낸 매칭 표 n개(RANK 순)"
writes:
  - field: "analysis[*].evidences"
    type: "list[Evidence]"
    desc: "재정렬됨 — evidences[0] = 최적 표"

# reads/writes 타입(Claim·Article·ClaimAnalysis 등)은 모두 src/schemas/runtime.py 의 MasterSchema 정의
schema_source: "src/schemas/runtime.py (MasterSchema)"
# 테스트셋 레코드(이 단계 *_source_1.jsonl) 의 실제 최상위 필드 (구조 상세는 io.jsonl 예시)
record_fields: ["row_id", "label", "claim_id", "claim", "evidences", "gold_best_index", "scorable", "scorable_reason"]
