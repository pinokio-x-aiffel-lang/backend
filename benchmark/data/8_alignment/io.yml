module: check_alignment
step: 8
folder: "8_alignment"
title: "통계수치와 문장의 정합성 판단"
description: "verdict=T 인 건만 문장 해석 정합성을 LLM 으로 재판정한다(일치→T, 오도/왜곡→M, LLM실패→NEI)."
reads:
  - field: "verifications.claim_results[*].metric"
    type: "MetricResult"
    desc: "[7] verdict=T 결과"
writes:
  - field: "verifications.claim_results[*].metric"
    type: "MetricResult"
    desc: "보정 — verdict(T→T/M/NEI) + align_reason/align_source"

schema_source: "src/schemas/runtime.py (MasterSchema)"
record_fields:
  [
    "row_id",
    "label",
    "claim_id",
    "claim",
    "evidence",
    "gold",
    "scorable",
    "scorable_reason",
  ]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["row_id", "claim_id"]
  "② 입력": ["claim", "evidence"]
  "③ 정답(gold)": ["label", "gold"]
  "④ 채점 가능 메타": ["scorable", "scorable_reason"]
