module: check_alignment
step: 8
folder: "8_alignment"
title: "통계수치와 문장의 정합성 판단"
description: "verdict=T 인 건만 문장 해석 정합성을 LLM 으로 재판정한다(일치→T, 오도/왜곡→M, LLM실패→NEI)."
reads:
  - field: "verifications.claim_results[*].metric"
    type: "MetricResult"
    desc: "[7] verdict=T 결과"
writes:
  - field: "verifications.claim_results[*].metric"
    type: "MetricResult"
    desc: "보정 — verdict(T→T/M/NEI) + align_reason/align_source"

# reads/writes 타입(Claim·Article·ClaimAnalysis 등)은 모두 src/schemas/runtime.py 의 MasterSchema 정의
schema_source: "src/schemas/runtime.py (MasterSchema)"
# 테스트셋 레코드(이 단계 *_source_1.jsonl) 의 실제 최상위 필드 (구조 상세는 io.jsonl 예시)
record_fields: ["row_id", "label", "claim_id", "claim", "evidence", "gold", "scorable", "scorable_reason"]
