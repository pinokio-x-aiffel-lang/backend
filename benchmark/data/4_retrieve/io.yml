module: retrieve_kosis_candidates
step: 4
folder: "4_retrieve"
title: "KOSIS 통계표 n개 찾기"
description: "claim 의 subject/unit/period 로 KOSIS 통합검색을 돌려 후보 통계표 풀을 만든다."
reads:
  - field: "claims"
    type: "list[Claim]"
    desc: "subject/unit/period 등 검색 키"
writes:
  - field: "analysis"
    type: "list[ClaimAnalysis]"
    desc: "claim별 kosis_search 로그 + candidates 풀"

schema_source: "src/schemas/runtime.py (MasterSchema)"
record_fields:
  [
    "row_id",
    "label",
    "claim_id",
    "subject",
    "unit",
    "period_type",
    "population",
    "claim_value_raw",
    "candidates",
    "search_success",
    "search_hits",
    "gold_tbl_id",
    "gold_item_hint",
    "scorable",
    "scorable_reason",
  ]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["row_id", "claim_id"]
  "② 입력": ["subject", "unit", "period_type", "population", "claim_value_raw", "candidates"]
  "③ 정답(gold)": ["label", "gold_tbl_id", "gold_item_hint"]
  "④ 채점 가능 메타": ["search_success", "search_hits", "scorable", "scorable_reason"]
