module: normalize_claim
step: 3
folder: "3_normalize"
title: "한국어 수사 산술로 변환"
description: "claims[*].value.raw(한국어 수사·기간)를 산술/표준형으로 정규화해 llm_value 에 채운다."
# reads = 모듈이 입력으로 읽는 MasterSchema 필드
reads:
  - field: "claims[*].value.raw"
    type: "str"
    desc: "한국어 수사 표현(예: 2858만9000명, 지난 3월)"
# writes = 모듈이 출력으로 쓰는 MasterSchema 필드
writes:
  - field: "claims[*].value.llm_value"
    type: "str"
    desc: "정규화된 산술/표준형(예: 28589000, 2025-03)"

schema_source: "src/schemas/runtime.py (MasterSchema)"
# record_fields = 테스트셋 파일(*_source_1.jsonl) 한 줄(=한 샘플)이 실제로 갖는 최상위 키 목록
record_fields:
  [
    "provenance",
    "src_id",
    "row_id",
    "base",
    "value",
    "period_value",
    "compare_period_value",
    "gold",
    "src_text",
  ]

# ── 레코드가 담는 4요소 (채점에 꼭 필요) ──
#   ① 식별(추적): SSOT 역추적·claim 매칭·클래스 (없으면 결과 추적 불가)
#   ② 입력: 모듈에 넣을 데이터 (없으면 실행/예측대조 불가)
#   ③ 정답(gold): 채점 기준 (없으면 맞고틀림 판정 불가)
#   ④ 채점 가능 메타: 채점 가능 여부·사유 (없으면 채점불가 행 섞여 지표 왜곡)
record_field_roles:
  "① 식별(추적)": ["provenance", "src_id", "row_id"]
  "② 입력": ["base", "value", "period_value", "compare_period_value", "src_text"]
  "③ 정답(gold)": ["gold"]
