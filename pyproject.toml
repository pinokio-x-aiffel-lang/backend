[project]
name = "fake-news-detect"
version = "0.1.0"
description = "Statistical claim verification system for fake news detection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.13.4",
    "openai>=1.50.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "sse-starlette>=2.0.0",
    "requests>=2.34.2",
    "langfuse>=4.6.1",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.2",
    "sqlalchemy>=2.0.50",
    "aiohttp>=3.13.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "rust-just>=1.51.0",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.scripts]
x = "scripts.run:main"
